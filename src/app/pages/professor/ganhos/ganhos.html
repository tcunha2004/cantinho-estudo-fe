<app-page-header title="Meus ganhos" subtitle="Aulas dadas e pagamentos" />

<div class="mt-6 grid grid-cols-1 gap-5 md:grid-cols-2">
  <app-card>
    <p class="text-ink-soft">Aulas no mês</p>
    <p class="mt-3 font-display text-4xl font-extrabold">{{ lessonsInMonth() }}</p>
  </app-card>

  <app-card class="bg-accent-soft">
    <p class="text-ink-soft">A receber</p>
    <p class="mt-3 font-display text-4xl font-extrabold text-accent">
      {{ amountToReceive() | currency }}
    </p>
  </app-card>
</div>

<app-card class="mt-6">
  <h2 class="font-display text-2xl font-bold">Aulas por semana · {{ today | date: 'MMMM' }}</h2>

  <div class="mt-6 flex items-end justify-between gap-6 px-6 py-8">
    @for (week of weeklyCounts(); track week.week) {
      <div class="flex w-full flex-col items-center gap-3">
        <div class="font-bold">{{ week.count ?? 0 }}</div>
        <div class="flex h-48 items-end">
          <div
            class="mx-auto h-full w-28 rounded-lg bg-accent"
            [style.height.%]="((week.count ?? 0) / busiestWeek()) * 100"
          ></div>
        </div>
        <div class="mt-3 text-ink-soft">Sem {{ week.week }}</div>
      </div>
    } @empty {
      <p class="w-full text-center text-ink-soft">Nenhuma aula registrada neste mês.</p>
    }
  </div>
</app-card>
