@if (message(); as text) {
  <div
    role="alert"
    class="mb-5 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 rounded-xl bg-red-50 px-4 py-2.5 text-sm font-bold text-red-600 print:hidden"
  >
    <span>{{ text }}</span>
    <a routerLink="/whatsapp" class="underline">Reconectar</a>
  </div>
}
