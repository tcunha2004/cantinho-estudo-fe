<div class="min-h-dvh bg-cream">
  <aside
    class="fixed inset-y-0 left-0 flex w-64 flex-col border-r border-line bg-white print:hidden"
  >
    <!-- Logo -->
    <div class="px-6 pb-5 pt-7">
      <img src="cantinho-estudo-logo.jpeg" alt="Cantinho do Estudo" class="w-36" />
    </div>
    <div class="mx-6 border-t border-line"></div>

    <!-- Navegação -->
    <nav class="flex-1 space-y-1.5 overflow-y-auto p-4" aria-label="Menu principal">
      @for (item of navItems(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          class="nav-link flex items-center gap-3.5 rounded-2xl px-4 py-3 font-bold text-ink-soft transition-colors hover:bg-cream"
        >
          <app-icon [name]="item.icon" class="size-5 shrink-0" />
          {{ item.label }}
        </a>
      }
    </nav>

    <!-- Rodapé -->
    <div class="border-t border-line p-4">
      <button
        type="button"
        (click)="logout()"
        class="flex w-full items-center gap-3.5 rounded-2xl px-4 py-2.5 text-left font-bold text-ink-soft transition-colors hover:bg-cream"
      >
        <app-icon name="log-out" class="size-5 shrink-0" />
        Sair
      </button>
    </div>
  </aside>

  <!-- Área de conteúdo -->
  <main class="ml-64 min-h-dvh p-8 print:ml-0 print:min-h-0 print:p-0">
    <!-- Barra fixa do painel: acompanha o admin em todas as páginas. -->
    @if (isAdmin()) {
      <div class="mb-5 flex justify-end print:hidden">
        <app-notifications />
      </div>
    }

    <router-outlet />
  </main>
</div>
